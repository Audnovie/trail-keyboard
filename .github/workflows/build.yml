name: Build and test

on:
  push:
    branches: [main]
    # Notes alone don't change the app: no rebuild (and no new release) for them.
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    name: Engine tests (Mac)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools on this runner
        run: |
          mkdir -p logs
          {
            sw_vers
            xcodebuild -version
            swift --version
            node --version
            python3 --version
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -i iphone | head -20
          } 2>&1 | tee logs/versions.log

      - name: Generated files are up to date
        run: |
          python3 tools/build_lexicon.py --check 2>&1 | tee logs/generated.log
          node tools/fixtures/gen.js --check 2>&1 | tee -a logs/generated.log

      - name: swift test (optimised, as on the phone)
        run: |
          set -o pipefail
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee logs/engine-test.log

      - name: Save logs to the ci-logs-engine branch
        if: always()
        run: |
          cd logs
          echo "commit ${{ github.sha }} run ${{ github.run_id }} attempt ${{ github.run_attempt }} status ${{ job.status }}" > STATUS
          git init -q -b logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "engine logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:ci-logs-engine

  ios:
    name: iPhone app, simulator tests, .ipa
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          mkdir -p logs
          brew install xcodegen 2>&1 | tail -3
          xcodegen --version | tee logs/ios-versions.log
          xcodebuild -version | tee -a logs/ios-versions.log

      - name: Generate the Xcode project
        run: xcodegen generate 2>&1 | tee logs/xcodegen.log

      - name: Pick and start a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              ver = tuple(int(x) for x in rt.split("iOS-")[-1].split("-"))
              for dev in devs:
                  if dev["name"] in ("iPhone 17 Pro", "iPhone 17"):
                      if best is None or ver > best[0]: best = (ver, dev["udid"], dev["name"])
          print(best[1])
          sys.stderr.write("simulator: %s iOS %s\n" % (best[2], ".".join(map(str, best[0]))))
          ')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          # Boots while the app builds.
          xcrun simctl boot "$UDID" || true

      - name: Build for the simulator
        run: |
          set -o pipefail
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild build-for-testing -project Trail.xcodeproj -scheme Trail \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/sim \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 SWIFT_COMPILATION_MODE=wholemodule \
            2>&1 | tee logs/sim-build-full.log | grep -E "error:|warning: .*/(Shared|Keyboard|App|UITests|Tests)/|BUILD|\*\* " | tee logs/sim-build.log

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIM" -b | tail -1

      - name: Test on the simulator
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Trail.xcodeproj -scheme Trail \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build/sim -resultBundlePath build/Tests.xcresult \
            2>&1 | tee logs/ios-test-full.log | grep -E "error:|Test Case|Executed|HARNESS|BUDGET|\*\* " | tee logs/ios-test.log

      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult 2>&1 | tee logs/ios-test-summary.json | head -80 || true
          xcrun xcresulttool get test-results tests --path build/Tests.xcresult > logs/ios-tests.json 2>&1 || true

      - name: The real keyboard extension in the simulator (best effort)
        if: always()
        continue-on-error: true
        run: |
          set -x
          BUNDLE=io.github.audnovie.trail.keyboard
          xcrun simctl spawn "$SIM" defaults read .GlobalPreferences AppleKeyboards > logs/real-keyboards-before.txt 2>&1 || true
          xcrun simctl spawn "$SIM" defaults write .GlobalPreferences AppleKeyboards -array "$BUNDLE" "en_US@sw=QWERTY;hw=Automatic" "emoji@sw=Emoji"
          xcrun simctl spawn "$SIM" defaults write .GlobalPreferences AppleKeyboardsExpanded -int 1
          xcrun simctl spawn "$SIM" defaults write com.apple.Preferences KeyboardsCurrentAndNext -array "$BUNDLE" "en_US@sw=QWERTY;hw=Automatic"
          xcrun simctl spawn "$SIM" defaults read .GlobalPreferences AppleKeyboards > logs/real-keyboards-after.txt 2>&1 || true
          xcrun simctl shutdown "$SIM"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b | tail -1
          mkdir -p logs/real
          (
            for i in $(seq 1 40); do
              PID=$(pgrep -f "TrailKeyboard.appex/TrailKeyboard" | head -1)
              if [ -n "$PID" ]; then
                { date; ps -o pid,rss,vsz,command -p "$PID"; footprint "$PID" 2>&1 | head -40; } >> logs/real/footprint.txt
                xcrun simctl io "$SIM" screenshot "logs/real/screen-$i.png" >/dev/null 2>&1
              else
                echo "$(date) no TrailKeyboard process" >> logs/real/footprint.txt
                [ $((i % 5)) -eq 0 ] && xcrun simctl io "$SIM" screenshot "logs/real/screen-$i.png" >/dev/null 2>&1
              fi
              sleep 4
            done
          ) &
          SAMPLER=$!
          TEST_RUNNER_TRAIL_REAL_KEYBOARD=1 xcodebuild test-without-building -project Trail.xcodeproj -scheme Trail \
            -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build/sim \
            -only-testing:TrailUITests/RealKeyboardUITests 2>&1 | tee logs/real/test-full.log | grep -E "REAL|error|Test Case|Executed" | tee logs/real/test.log
          kill $SAMPLER 2>/dev/null || true
          ls logs/real | head -50

      - name: Build the unsigned .ipa
        run: |
          set -o pipefail
          xcodebuild -project Trail.xcodeproj -scheme Trail -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/ipa-build-full.log | grep -E "error:|warning: |BUILD|\*\* " | tee logs/ipa-build.log
          APP=build/dev/Build/Products/Release-iphoneos/Trail.app
          ls -la "$APP" "$APP/PlugIns" | tee logs/ipa-contents.log
          /usr/libexec/PlistBuddy -c Print "$APP/PlugIns/TrailKeyboard.appex/Info.plist" | tee -a logs/ipa-contents.log
          du -sh "$APP" "$APP/PlugIns/TrailKeyboard.appex" | tee -a logs/ipa-contents.log
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Trail.ipa Payload)
          ls -la dist/Trail.ipa | tee -a logs/ipa-contents.log
          shasum -a 256 dist/Trail.ipa | tee dist/Trail.ipa.sha256 | tee -a logs/ipa-contents.log

      - uses: actions/upload-artifact@v4
        with:
          name: Trail-ipa
          path: dist/Trail.ipa

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/Trail.ipa dist/Trail.ipa.sha256 \
            --title "Trail (latest build)" --target "$GITHUB_SHA" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install it with Sideloadly; see README.md." 2>&1 | tee logs/release.log

      - name: Save logs to the ci-logs-ios branch
        if: always()
        run: |
          cd logs
          for f in sim-build-full.log ios-test-full.log ipa-build-full.log real/test-full.log; do
            if [ -f "$f" ]; then gzip -f "$f"; fi
          done
          echo "commit ${{ github.sha }} run ${{ github.run_id }} attempt ${{ github.run_attempt }} status ${{ job.status }}" > STATUS
          git init -q -b logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ios logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:ci-logs-ios
